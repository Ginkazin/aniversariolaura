<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartaz QR da festa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Crimson+Pro:wght@400;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script>
  // ============================================================
  //  TEXTOS DO CARTAZ — edite aqui
  //  Use **assim** para deixar um trecho em destaque (negrito).
  //  {nome} é trocado pelo nome do config.js.
  // ============================================================
  window.CARTAZ = {
    titulo: 'Ajude a construir as memórias da {nome}!',
    instrucao: 'Aponte a câmera do celular para o **QR Code**, toque em **“Foto ou vídeo”** e escolha a **minha moldura** personalizada!',
    lembranca: 'Sua lembrança fará parte para sempre desse dia especial!',
    rodape: 'Não se esqueça de deixar um **recadinho** para mim!',
  };
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: "Nunito", sans-serif; color: #4a3566; background: #ece6f3; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .toolbar { max-width: 900px; margin: 0 auto; padding: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .toolbar input, .toolbar select { padding: 10px 12px; border: 2px solid #dccdfa; border-radius: 12px; font: inherit; background: #fff; }
  .toolbar input { flex: 1; min-width: 240px; }
  .toolbar button { padding: 10px 18px; border: 0; border-radius: 12px; background: #8f6ae8; color: #fff; font: 800 1rem "Nunito", sans-serif; cursor: pointer; }
  .hint { width: 100%; margin: 0; font-size: .85rem; color: #7a6b93; }

  /* Folha A4 */
  .sheet { margin: 0 auto 30px; background: #fff; display: grid; place-content: center; gap: 6mm; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  .sheet.n1 { width: 210mm; height: 297mm; --w: 190mm; }
  .sheet.n2 { width: 297mm; height: 210mm; --w: 128mm; grid-template-columns: auto auto; }
  .sheet.n4 { width: 210mm; height: 297mm; --w: 92mm; grid-template-columns: auto auto; gap: 4mm; }
  .sheet.nfoto { width: 100mm; height: 150mm; --w: 100mm; gap: 0; }

  /* ---------- Cartaz (proporção 2:3; 1em = 1% da largura) ---------- */
  .poster {
    position: relative; overflow: hidden;
    width: var(--w); height: calc(var(--w) * 1.5);
    font-size: calc(var(--w) / 100);
    background:
      radial-gradient(ellipse at 50% 35%, #ffffff 0%, rgba(255,255,255,0) 70%),
      linear-gradient(180deg, #fbfaf7 0%, #f8f6f1 100%);
  }
  /* gramadinho no rodapé */
  .poster::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14em;
    background:
      radial-gradient(ellipse 30em 7em at 20% 100%, rgba(186,206,120,.55), transparent 70%),
      radial-gradient(ellipse 34em 8em at 60% 100%, rgba(196,214,140,.5), transparent 70%),
      radial-gradient(ellipse 30em 6em at 95% 100%, rgba(186,206,120,.45), transparent 70%),
      linear-gradient(180deg, rgba(220,230,180,0), rgba(214,226,166,.55));
  }
  .poster > * { position: absolute; }
  .star { height: auto; opacity: .85; }

  .brasao { left: 50%; top: 0.6em; width: 38em; transform: translateX(-50%); }

  /* caixas de texto: posição em unidades do cartaz; a fonte fica no <p> de dentro */
  .tx { left: 0; right: 0; text-align: center; }
  .tx p { margin: 0; }
  .tx-titulo { top: 47.6em; padding: 0 1.5em; }
  .tx-instrucao { top: 57em; padding: 0 11em; }
  .tx-lembranca { top: 112.6em; padding: 0 28em; }
  .tx-rodape { top: 124.5em; padding: 0 34em; }

  .titulo {
    white-space: nowrap;
    font: italic 700 4.35em/1.1 "Playfair Display", Georgia, serif; color: #f07cc0; letter-spacing: -0.02em;
  }
  .instrucao {
    font: 400 3.95em/1.33 "Crimson Pro", Georgia, serif; color: #f29fd0; letter-spacing: -0.03em;
  }
  .poster b { font-weight: 700; color: #e46fb6; }

  .qr { left: 50%; top: 83em; width: 26em; height: 26em; transform: translateX(-50%); background: #fff; padding: 0.6em; }
  .qr canvas, .qr img { display: block; width: 100% !important; height: 100% !important; image-rendering: pixelated; }

  .lembranca, .rodape {
    font: 400 3.15em/1.18 "Crimson Pro", Georgia, serif; color: #f29fd0; letter-spacing: -0.03em;
  }

  .laurinha { left: 0.5em; bottom: 1em; height: 49em; width: auto; }
  .castelo { right: -9em; bottom: 2em; height: 52em; width: auto; }
  .unicornio { right: 6em; bottom: 0.5em; width: 28em; height: auto; }

  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .sheet { margin: 0; box-shadow: none; }
  }
</style>
<style id="pageSize">@page { size: A4 portrait; margin: 0; }</style>
</head>
<body>
  <div class="toolbar">
    <input id="url" placeholder="Endereço do site (https://...)">
    <select id="qtd" aria-label="Cartazes por folha">
      <option value="foto">10×15 cm — display de mesa / gráfica</option>
      <option value="2">2 por folha A4 (13×19 cm cada) — impressora de casa</option>
      <option value="4">4 por folha A4 (9×14 cm cada)</option>
      <option value="1">1 por folha A4 (cartaz de parede)</option>
    </select>
    <button id="print" type="button">Imprimir / salvar PDF</button>
    <p class="hint">O endereço vem do <code>siteUrl</code> do config.js. Os textos podem ser editados no topo deste arquivo (qrcode.html).
      Para mandar para a gráfica, escolha "Salvar como PDF" na janela de impressão.</p>
  </div>
  <div class="sheet n1" id="sheet"></div>

<template id="tpl">
  <div class="poster">
    <img class="star" src="img/estrela.webp" alt="" style="left:5em;top:5.5em;width:9em;transform:rotate(-12deg)">
    <img class="star" src="img/estrela.webp" alt="" style="left:81.5em;top:7em;width:5em;transform:rotate(10deg)">
    <img class="star" src="img/estrela.webp" alt="" style="left:2.5em;top:25.5em;width:2.6em">
    <img class="star" src="img/estrela.webp" alt="" style="left:16.5em;top:32.5em;width:4.5em;transform:rotate(15deg)">
    <img class="star" src="img/estrela.webp" alt="" style="left:87.5em;top:30em;width:8em;transform:rotate(-8deg)">
    <img class="star" src="img/estrela.webp" alt="" style="left:4em;top:64em;width:4.2em;transform:rotate(20deg)">
    <img class="star" src="img/estrela.webp" alt="" style="left:90.5em;top:69.5em;width:4.5em;transform:rotate(-15deg)">
    <img class="star" src="img/estrela.webp" alt="" style="left:15.5em;top:83.5em;width:4.6em;transform:rotate(8deg)">
    <img class="star" src="img/estrela.webp" alt="" style="left:74em;top:88em;width:2.5em">
    <img class="star" src="img/estrela.webp" alt="" style="left:5em;top:100.5em;width:4.2em;transform:rotate(-20deg)">
    <img class="star" src="img/estrela.webp" alt="" style="left:90.5em;top:93.5em;width:8.5em;transform:rotate(12deg)">

    <img class="brasao" src="img/brasao.webp" alt="">

    <div class="tx tx-titulo"><p class="titulo" data-t="titulo"></p></div>
    <div class="tx tx-instrucao"><p class="instrucao" data-t="instrucao"></p></div>
    <div class="qr"></div>
    <div class="tx tx-lembranca"><p class="lembranca" data-t="lembranca"></p></div>
    <div class="tx tx-rodape"><p class="rodape" data-t="rodape"></p></div>

    <img class="castelo" src="img/castelo.webp" alt="">
    <img class="unicornio" src="img/unicornio.webp" alt="">
    <img class="laurinha" src="img/laurinha.webp" alt="">
  </div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const C = window.FESTA || {};
  const T = window.CARTAZ;
  const urlInput = document.getElementById('url');
  const qtd = document.getElementById('qtd');
  urlInput.value = C.siteUrl || location.href.replace(/qrcode\.html.*$/, '');
  document.title = 'Cartaz QR — ' + (C.nome || 'festa');

  // texto com **destaque** -> <b>, sem aceitar HTML
  function rich(el, text) {
    el.textContent = '';
    String(text).replace(/\{nome\}/g, C.nome || 'aniversariante').split('**').forEach((part, i) => {
      if (!part) return;
      if (i % 2) { const b = document.createElement('b'); b.textContent = part; el.append(b); }
      else el.append(document.createTextNode(part));
    });
  }

  // encolhe o título até caber numa linha
  function fitTitle(p) {
    const el = p.querySelector('.titulo');
    let size = 4.35;
    el.style.fontSize = size + 'em';
    const box = el.parentElement;
    while (el.scrollWidth > box.clientWidth - 2 && size > 2.5) { size -= 0.05; el.style.fontSize = size + 'em'; }
  }

  function build() {
    const modo = qtd.value;
    const n = modo === 'foto' ? 1 : Number(modo);
    const sheet = document.getElementById('sheet');
    sheet.className = 'sheet n' + modo;
    document.getElementById('pageSize').textContent = modo === 'foto'
      ? '@page { size: 100mm 150mm; margin: 0; }'
      : `@page { size: A4 ${n === 2 ? 'landscape' : 'portrait'}; margin: 0; }`;
    sheet.innerHTML = '';
    const tpl = document.getElementById('tpl');
    for (let i = 0; i < n; i++) {
      const p = tpl.content.firstElementChild.cloneNode(true);
      p.querySelectorAll('[data-t]').forEach(el => rich(el, T[el.dataset.t] || ''));
      sheet.append(p);
      new QRCode(p.querySelector('.qr'), {
        text: urlInput.value.trim() || location.href, width: 600, height: 600,
        colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M,
      });
      fitTitle(p);
    }
  }
  urlInput.addEventListener('change', build);
  qtd.addEventListener('change', build);
  document.getElementById('print').addEventListener('click', () => window.print());
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(build);
</script>
</body>
</html>
